<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0E7A5F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Misk INSET">
<title>Misk Schools — INSET 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@500&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --g-primary:#0E7A5F; --g-deep:#0A4D3A; --g-teal:#2DB597;
  --purple:#6E4AA6; --purple-t:#5A3A8C; --purple-bg:#F0EBF8;
  --ln-bg:#E5F1EC; --ln-txt:#0B6B4F;
  --paper:#F4F1EA; --white:#FFFFFF;
  --ink:#14241D; --muted:#6E7C76; --ghost:#9AA39E;
  --hair:rgba(20,36,29,.09);
  --r-card:16px; --r-pill:100px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hanken Grotesk',system-ui,sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}

/* ── HEADER ── */
.hdr{background:linear-gradient(155deg,#16A07E 0%,#0E7A5F 42%,#0A4D3A 100%);padding:max(52px,calc(44px + env(safe-area-inset-top))) 20px 0;position:sticky;top:0;z-index:100}
.hdr-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.hdr-logo{height:36px}
.hdr-eyebrow{font-size:11px;font-weight:600;letter-spacing:1.6px;text-transform:uppercase;color:rgba(255,255,255,.65);margin-bottom:5px}
.hdr-title{font-family:'Newsreader',serif;font-weight:500;font-size:36px;color:#fff;line-height:1.05;letter-spacing:-.5px;margin-bottom:5px}
.hdr-dates{font-size:13px;color:rgba(255,255,255,.6);margin-bottom:18px}

/* ── SCHOOL SWITCHER ── */
.switcher{display:flex;gap:4px;background:rgba(0,0,0,.18);border-radius:var(--r-pill);padding:4px;margin-bottom:-1px}
.sch-pill{flex:1;padding:9px 8px;border-radius:var(--r-pill);border:none;background:transparent;color:rgba(255,255,255,.65);font-family:'Hanken Grotesk',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all .18s;text-align:center}
.sch-pill.active{background:#fff;color:var(--ink)}
.sch-pill:hover:not(.active){color:rgba(255,255,255,.9)}

/* ── SHEET ── */
.sheet{background:var(--paper);border-radius:20px 20px 0 0;min-height:calc(100vh - 220px);padding:20px 16px 100px}

/* ── NOTIFICATION BANNER (one-time) ── */
.notif-banner{background:var(--g-deep);border-radius:var(--r-card);padding:14px 16px;margin-bottom:16px;display:none;align-items:center;gap:12px}
.notif-banner.show{display:flex}
.nb-icon{font-size:22px;flex-shrink:0}
.nb-txt strong{font-size:13px;color:#fff;display:block;font-weight:700}
.nb-txt span{font-size:12px;color:rgba(255,255,255,.7)}
.nb-actions{margin-left:auto;display:flex;gap:8px;flex-shrink:0}
.nb-allow{padding:7px 13px;border-radius:var(--r-pill);background:#fff;color:var(--g-deep);border:none;font-family:'Hanken Grotesk',sans-serif;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.nb-dismiss{padding:7px 10px;border-radius:var(--r-pill);background:rgba(255,255,255,.15);color:#fff;border:none;font-family:'Hanken Grotesk',sans-serif;font-size:12px;cursor:pointer;white-space:nowrap}

/* ── DAY SELECTOR ── */
.day-row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-bottom:20px}
.day-row::-webkit-scrollbar{display:none}
.day-chip{flex-shrink:0;display:flex;flex-direction:column;align-items:center;padding:10px 14px;border-radius:14px;border:1.5px solid var(--hair);background:var(--white);cursor:pointer;transition:all .18s;font-family:'Hanken Grotesk',sans-serif}
.day-chip .dn{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.3px}
.day-chip .dd{font-size:20px;font-weight:700;color:var(--ink);line-height:1.15;margin-top:2px}
.day-chip.active{background:var(--g-deep);border-color:var(--g-deep)}
.day-chip.active .dn{color:rgba(255,255,255,.65)}
.day-chip.active .dd{color:#fff}
.day-chip:hover:not(.active){border-color:var(--g-primary)}

/* ── DAY LABEL ── */
.day-label{font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--g-primary);margin-bottom:14px;text-align:center}

/* ── SESSION CARDS ── */
.s-card{background:var(--white);border-radius:var(--r-card);margin-bottom:8px;border:1.5px solid var(--hair);overflow:hidden;transition:box-shadow .18s}
.s-card:hover{box-shadow:0 4px 18px rgba(20,36,29,.08)}
.s-card.tbc{background:transparent;border:1.5px dashed var(--hair);box-shadow:none}
.s-card.tbc:hover{box-shadow:none}

.sc-inner{padding:16px 16px 16px 14px;display:flex;gap:0;align-items:flex-start}
.sc-inner.tbc-inner{padding:12px 16px;align-items:center}
.sc-bar{width:4px;border-radius:4px;margin-right:14px;flex-shrink:0;align-self:stretch;min-height:48px}
.bar-break{background:var(--purple)}
.bar-lunch{background:var(--g-primary)}
.bar-shared{background:var(--g-teal)}
.bar-school{background:var(--g-teal)}
.bar-split{background:var(--purple)}

.sc-content{flex:1;min-width:0;text-align:center}
.sc-time-row{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:5px}
.sc-start{font-size:15px;font-weight:700;color:var(--ink)}
.sc-end{font-size:12px;color:var(--muted)}
.chip{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;padding:3px 9px;border-radius:var(--r-pill)}
.chip-break{background:var(--purple-bg);color:var(--purple-t)}
.chip-lunch{background:var(--ln-bg);color:var(--ln-txt)}
.chip-shared{background:rgba(45,181,151,.12);color:var(--g-deep)}
.chip-school{background:rgba(45,181,151,.12);color:var(--g-deep)}
.chip-split{background:var(--purple-bg);color:var(--purple-t)}
.sc-title{font-family:'Newsreader',serif;font-weight:500;font-size:20px;color:var(--ink);line-height:1.2;margin-bottom:4px;text-align:center}
.sc-loc{font-size:12px;color:var(--muted);text-align:center}
.tbc-time{font-size:12px;font-weight:500;color:var(--muted)}
.tbc-label{font-size:13px;color:var(--ghost);margin-left:12px}

/* Split rows */
.split-rows{margin-top:10px;display:flex;flex-direction:column;gap:5px;align-items:center}
.split-row{display:flex;align-items:baseline;gap:6px;font-size:13px}
.split-dot{width:5px;height:5px;border-radius:50%;background:var(--purple);flex-shrink:0;margin-top:5px}
.split-lbl{font-weight:700;color:var(--g-deep);font-size:12px;flex-shrink:0}
.split-val{color:var(--ink)}
.split-val.tbc-val{color:var(--ghost);font-style:italic}

/* ── OVERLAY ── */
.overlay{display:none;position:fixed;inset:0;background:rgba(14,36,29,.38);z-index:200;backdrop-filter:blur(3px)}
.overlay.open{display:block}

/* ── ADMIN PANEL ── */
#adm{display:none;position:fixed;inset:0;background:var(--paper);z-index:400;overflow-y:auto;padding-bottom:80px}
#adm.open{display:block}
.adm-hdr{background:linear-gradient(155deg,#16A07E 0%,#0E7A5F 42%,#0A4D3A 100%);padding:max(52px,calc(44px + env(safe-area-inset-top))) 20px 20px;display:flex;align-items:center;justify-content:space-between}
.adm-hdr-left .adm-ey{font-size:11px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:rgba(255,255,255,.6);margin-bottom:4px}
.adm-hdr-left h2{font-family:'Newsreader',serif;font-size:26px;font-weight:500;color:#fff}
.close-btn{width:36px;height:36px;border-radius:50%;border:1.5px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.adm-body{padding:22px 18px 0}
.flbl{font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:7px}
.fg{margin-bottom:18px}
select,textarea{width:100%;padding:13px 15px;border:1.5px solid var(--hair);border-radius:12px;font-size:14px;color:var(--ink);background:var(--white);font-family:'Hanken Grotesk',sans-serif;outline:none;transition:border-color .2s}
select:focus,textarea:focus{border-color:var(--g-primary)}
textarea{resize:vertical;min-height:110px;line-height:1.5}
.qw{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.qc{padding:7px 12px;border-radius:var(--r-pill);border:1.5px solid var(--hair);background:var(--white);font-size:12px;color:var(--muted);cursor:pointer;font-family:'Hanken Grotesk',sans-serif;transition:all .18s}
.qc:hover{border-color:var(--g-primary);color:var(--g-deep);background:var(--ln-bg)}
.btn-p{width:100%;padding:15px;background:var(--g-deep);color:#fff;border:none;border-radius:12px;font-family:'Hanken Grotesk',sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:background .2s}
.btn-p:hover{background:var(--g-primary)}
.btn-p:disabled{opacity:.45;cursor:not-allowed}
.res{padding:12px 14px;border-radius:12px;font-size:13px;font-weight:600;margin-top:12px;display:none;border:1.5px solid}
.res.ok{background:var(--ln-bg);color:var(--ln-txt);border-color:#a8d8b8}
.res.err{background:#fce8e8;color:#8b1a1a;border-color:#f0aaaa}

/* ── BOTTOM NAV ── */
.bnav{position:fixed;bottom:0;left:0;right:0;background:var(--white);border-top:1.5px solid var(--hair);display:flex;padding:8px 0 max(12px,env(safe-area-inset-bottom));z-index:100}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:4px;border:none;background:none;color:var(--ghost);font-size:10px;font-weight:600;font-family:'Hanken Grotesk',sans-serif;transition:color .2s;letter-spacing:.3px}
.ni.active{color:var(--g-deep)}
.ni svg{width:21px;height:21px}
</style>
</head>

  document.getElementById("hdr-title").textContent=nm[sc];
  document.querySelectorAll(".sch-pill").forEach((p,i)=>p.classList.toggle("active",["js","gs","bs"][i]===sc));
}

function buildDays(){
  const c=document.getElementById("day-row");
  DAYS.forEach((d,i)=>{
    const b=document.createElement("button");
    b.className="day-chip"+(i===0?" active":"");
    b.innerHTML='<span class="dn">'+d.s+'</span><span class="dd">'+d.n+'</span>';
    b.onclick=()=>{di=i;document.querySelectorAll(".day-chip").forEach((x,j)=>x.classList.toggle("active",j===i));render();};
    c.appendChild(b);
  });
}

function render(){
  const day=DAYS[di];
  document.getElementById("day-label").textContent=day.f.toUpperCase();
  const ss=D[day.n]||[];
  document.getElementById("tt").innerHTML=ss.map(s=>{
    if(s.type==="tbc"){
      return '<div class="s-card tbc"><div class="sc-inner tbc-inner"><span class="tbc-time">'+s.t+'&#8211;'+s.e+'</span><span class="tbc-label">To be confirmed</span></div></div>';
    }
    if(s.type==="split"){
      const rows=s.sub.map(r=>'<div class="split-row"><div class="split-dot"></div><span class="split-lbl">'+r.l+':</span>&nbsp;<span class="split-val'+(r.v?"":" tbc-val")+'">'+(r.v||"TBC")+'</span></div>').join("");
      return '<div class="s-card"><div class="sc-inner"><div class="sc-bar bar-split"></div><div class="sc-content"><div class="sc-time-row"><span class="sc-start">'+s.t+'</span><span class="sc-end">'+s.e+'</span><span class="chip chip-split">Split Groups</span></div><div class="sc-title">Multiple Groups</div><div class="split-rows">'+rows+'</div></div></div></div>';
    }
    const val=s.type==="shared"?s.title:s[sc]||"";
    if(s.type==="school"&&!val){
      return '<div class="s-card tbc"><div class="sc-inner tbc-inner"><span class="tbc-time">'+s.t+'&#8211;'+s.e+'</span><span class="tbc-label">To be confirmed</span></div></div>';
    }
    const barCls="bar-"+s.type;
    const chipCls="chip-"+s.type;
    const chipLbl={shared:"Whole School",break:"Break",lunch:"Lunch",school:"Session"}[s.type];
    const title=s.type==="break"?"Break":s.type==="lunch"?"Lunch":val;
    const loc=(s.type==="break"||s.type==="lunch")?val:"";
    return '<div class="s-card"><div class="sc-inner"><div class="sc-bar '+barCls+'"></div><div class="sc-content"><div class="sc-time-row"><span class="sc-start">'+s.t+'</span><span class="sc-end">'+s.e+'</span><span class="chip '+chipCls+'">'+chipLbl+'</span></div><div class="sc-title">'+title+'</div>'+(loc?'<div class="sc-loc">&#8857;&nbsp;'+loc+'</div>':'')+'</div></div></div>';
  }).join("");
}

window.navTo=(v,el)=>{
  document.querySelectorAll(".ni").forEach(n=>n.classList.remove("active"));el.classList.add("active");
  if(v==="today"){const m={4:0,0:1,1:2,2:3,3:4};const i=m[new Date().getDay()]??0;di=i;document.querySelectorAll(".day-chip").forEach((x,j)=>x.classList.toggle("active",j===i));render();}
};

function checkNotifBanner(){
  if(localStorage.getItem("misk-nb-done"))return;
  if(!("Notification"in window))return;
  if(Notification.permission==="default"){
    document.getElementById("notif-banner").classList.add("show");
  }
}

window.reqNotif=async()=>{
  dismissNotifBanner();
  if(!fcm){return;}
  try{
    const p=await Notification.requestPermission();
    if(p==="granted"){
      const t=await getToken(fcm,{vapidKey:VAPID});
      localStorage.setItem("misk-tok",t);
      localStorage.setItem("misk-tsc",sc);
      // Store token in Firestore
      await storeToken(t, sc);
      toast("Notifications enabled","You'll be reminded before each session.");
    }
  }catch(e){console.error(e);}
};

async function storeToken(token, school){
  try{
    const {getFirestore, doc, setDoc} = await import("https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js");
    const db = getFirestore(fb);
    await setDoc(doc(db, "tokens", token), {
      token, school, updatedAt: new Date().toISOString()
    });
  }catch(e){console.error("Token store error:",e);}
}

async function getTokensForSchool(school){
  try{
    const {getFirestore, collection, query, where, getDocs} = await import("https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js");
    const db = getFirestore(fb);
    let q;
    if(school==="all"){
      q = collection(db,"tokens");
    } else {
      q = query(collection(db,"tokens"), where("school","==",school));
    }
    const snap = await getDocs(q);
    return snap.docs.map(d=>d.data().token);
  }catch(e){console.error("Token fetch error:",e);return[];}
}

window.dismissNotifBanner=()=>{
  document.getElementById("notif-banner").classList.remove("show");
  localStorage.setItem("misk-nb-done","1");
};

window.openAdm=()=>document.getElementById("adm").classList.add("open");
window.closeAdm=()=>document.getElementById("adm").classList.remove("open");
window.closeAll=()=>document.getElementById("overlay").classList.remove("open");
window.setMsg=m=>document.getElementById("adm-msg").value=m;

window.sendNotif=async()=>{
  const s=document.getElementById("adm-school").value;
  const m=document.getElementById("adm-msg").value.trim();
  const r=document.getElementById("res");
  const btn=document.querySelector(".adm-body .btn-p");
  if(!m){r.className="res err";r.style.display="block";r.textContent="Please write a message first.";return;}
  btn.textContent="Sending...";btn.disabled=true;
  try{
    const tokens=await getTokensForSchool(s);
    if(tokens.length===0){
      r.className="res err";r.style.display="block";
      r.textContent="No devices registered yet for "+( s==="all"?"all schools":s)+".";
      btn.textContent="Send Notification";btn.disabled=false;
      return;
    }
    const resp=await fetch("/.netlify/functions/send-notification",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({adminKey:"misk-admin-2026",school:s,message:m,tokens})
    });
    const data=await resp.json();
    if(data.success){
      r.className="res ok";r.style.display="block";
      r.textContent="Sent to "+data.sent+" device"+(data.sent!==1?"s":"")+(data.failed>0?" ("+data.failed+" failed)":"");
      document.getElementById("adm-msg").value="";
      setTimeout(()=>r.style.display="none",4000);
    } else {
      r.className="res err";r.style.display="block";
      r.textContent="Error: "+(data.error||"Unknown error");
    }
  }catch(e){
    r.className="res err";r.style.display="block";
    r.textContent="Failed to send — check your connection.";
  }
  btn.textContent="Send Notification";btn.disabled=false;
};

function toast(title,body){
  const t=document.createElement("div");
  t.style.cssText="position:fixed;top:24px;left:50%;transform:translateX(-50%);background:#0A4D3A;color:white;padding:13px 20px;border-radius:14px;font-size:13px;font-weight:600;z-index:999;max-width:340px;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.22);font-family:'Hanken Grotesk',sans-serif";
  t.innerHTML="<div>"+(title||"")+"</div>"+(body?'<div style="font-weight:400;margin-top:3px;opacity:.8">'+body+"</div>":"");
  document.body.appendChild(t);setTimeout(()=>t.remove(),5000);
}

init();
</script>
